<div
  class="mlv-timeline-item__col"
  [class.mlv-timeline-item__col--left]="direction() === 'left'"
  [class.mlv-timeline-item__col--right]="direction() === 'right'"
>
  <div
    class="mlv-timeline-item__content"
    [class.mlv-timeline-item__content--left]="direction() === 'left'"
  >
    <div class="mlv-timeline-item__header">
      <span class="mlv-timeline-item__title">{{ title() }}</span>
      @if (timestamp()) {
        <time class="mlv-timeline-item__timestamp">{{ timestamp() }}</time>
      }
      @if (_metaRef()) {
        <span class="mlv-timeline-item__meta">
          <ng-container [ngTemplateOutlet]="_metaRef()!.templateRef" />
        </span>
      }
    </div>
    <div class="mlv-timeline-item__description">
      <ng-content />
    </div>
  </div>
</div>

<div class="mlv-timeline-item__spine">
  <div class="mlv-timeline-item__node-circle">
    @if (_iconRef()) {
      <span class="mlv-timeline-item__node-icon" aria-hidden="true">
        <ng-container [ngTemplateOutlet]="_iconRef()!.templateRef" />
      </span>
    }
  </div>
  <div class="mlv-timeline-item__connector" aria-hidden="true"></div>
</div>
