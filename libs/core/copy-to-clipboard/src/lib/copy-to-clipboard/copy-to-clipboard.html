<!--
  With no `value`, the host's `aria-labelledby` names the host itself, then
  this wrapper, so the name is its own `aria-label` ("Copy to clipboard:")
  followed by the visible text (#326). No prefix node lives in the template:
  a text node would leak into the `textContent` of the host and every
  ancestor, and Firefox ignores the `aria-label` of a hidden referenced node.
-->
<span #content class="mlv-copy-to-clipboard__content" [id]="_contentId">
  <ng-content />
</span>
<span
  class="mlv-copy-to-clipboard__indicator"
  [mlvTooltip]="
    isCopied() ? _messages().copiedTooltip : _messages().copyTooltip
  "
  tooltipPlacement="top"
  aria-hidden="true"
>
  <span class="mlv-copy-to-clipboard__icon mlv-copy-to-clipboard__icon--idle">
    <svg lucideCopy [size]="16" />
  </span>
  <span
    class="mlv-copy-to-clipboard__icon mlv-copy-to-clipboard__icon--success"
  >
    <svg lucideCheck [size]="16" />
  </span>
</span>
<span class="mlv-copy-to-clipboard__live" aria-live="polite">
  @if (isCopied()) {
    {{ _copiedAnnouncement() }}
  }
</span>
