@if (headerRef() || actionsRef()) {
<div class="mlv-card__header-row">
  @if (headerRef(); as headerTpl) {
  <ng-container [ngTemplateOutlet]="headerTpl.templateRef" />
  } @if (actionsRef(); as actionsTpl) {
  <ng-container [ngTemplateOutlet]="actionsTpl.templateRef" />
  }
</div>
} @if (subheaderRef(); as subheaderTpl) {
<ng-container [ngTemplateOutlet]="subheaderTpl.templateRef" />
}

<div
  class="mlv-card__body"
  [class.mlv-card__body--stack]="bodyLayout() === 'stack'"
>
  <ng-content />
</div>

@if (footerRef(); as footerTpl) {
<ng-container [ngTemplateOutlet]="footerTpl.templateRef" />
}
