@if (shape() === 'bar') {
  @if (showPercentage()) {
    <span class="mlv-progress__percentage" aria-hidden="true">{{
      _percentageText()
    }}</span>
  }
  <div class="mlv-progress__track">
    <div
      class="mlv-progress__fill"
      [class.mlv-progress__fill--animated]="_progressVisible()"
      [style.width.%]="_clampedValue()"
    ></div>
  </div>
} @else {
  <div class="mlv-progress__svg-wrapper">
    <svg
      aria-hidden="true"
      class="mlv-progress__svg"
      [attr.viewBox]="_circleDimensions().viewBox"
      width="100%"
      height="100%"
    >
      <circle
        class="mlv-progress__circle-track"
        [attr.cx]="_circleDimensions().center"
        [attr.cy]="_circleDimensions().center"
        [attr.r]="_circleDimensions().radius"
        [attr.stroke-width]="_circleDimensions().strokeWidth"
      />
      <circle
        class="mlv-progress__circle-fill"
        [class.mlv-progress__circle-fill--animated]="_progressVisible()"
        [attr.cx]="_circleDimensions().center"
        [attr.cy]="_circleDimensions().center"
        [attr.r]="_circleDimensions().radius"
        [attr.stroke-width]="_circleDimensions().strokeWidth"
        [attr.stroke-dasharray]="_circleDimensions().circumference"
        [attr.stroke-dashoffset]="_strokeDashoffset()"
      />
    </svg>
    @if (showPercentage()) {
      <span class="mlv-progress__percentage" aria-hidden="true">{{
        _percentageText()
      }}</span>
    }
  </div>
}
<!-- THE LABEL SLOT IS AUTHORED EXACTLY ONCE, HERE, OUTSIDE THE @if (#258).
     Both shapes end with it, so it needs no branch — and a second bare
     `<ng-content />` can never come back inside one: the compiler emits one
     `'*'` projection slot per `<ng-content>`, and `matchingProjectionSlotIndex`
     hands every node no named slot claims to the LAST `'*'` in that list, so
     each earlier copy owns a bucket that stays empty for the instance's whole
     life. That is how the default `bar` dropped its label while `circle`
     rendered it. Outside the `@if`, a `shape` flip never destroys the slot
     either, so the projected nodes stay put.
     `aria-hidden` on purpose, and still the host's name: `aria-labelledby`
     reads a hidden referenced node's text (accname step 2A), so the label names
     the progressbar without also being exposed as a separate text node under
     it — Chrome does expose a visible one, so the text would be read twice. -->
<div #label class="mlv-progress__label" [id]="_labelId" aria-hidden="true">
  <ng-content />
</div>
