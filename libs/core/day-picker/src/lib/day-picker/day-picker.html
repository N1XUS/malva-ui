<mlv-form-control-wrapper>
  @if (label() || hint()) {
    <mlv-label
      [id]="labelId()"
      [for]="_ownLabelFor()"
      [required]="required()"
      (click)="_onLabelClick()"
    >
      {{ label() }}
      @if (hint()) {
        <mlv-hint>{{ hint() }}</mlv-hint>
      }
    </mlv-label>
  }

  <ng-template mlvFormControlWrapperControl>
    <mlv-popup-container class="mlv-day-picker__popup-container">
      <div
        #triggerRef
        class="mlv-day-picker__trigger"
        [id]="id()"
        role="combobox"
        [attr.aria-expanded]="isOpen()"
        [attr.aria-haspopup]="'dialog'"
        [attr.aria-controls]="isOpen() ? popupId() : null"
        [attr.aria-labelledby]="label() ? labelId() : _fieldLabelId()"
        [attr.aria-label]="label() || _fieldLabelId() ? null : ariaLabel()"
        [attr.aria-disabled]="computedDisabled() || null"
        [attr.aria-required]="required() || null"
        [attr.aria-describedby]="_describedBy()"
        [attr.tabindex]="computedDisabled() ? -1 : 0"
        (click)="toggleDropdown()"
        (keydown.enter)="toggleDropdown()"
        (keydown.space)="toggleDropdown(); $event.preventDefault()"
        (keydown.escape)="isOpen.set(false)"
        (focus)="setFocused(true)"
        (blur)="_onTriggerBlur()"
      >
        @if (displayValue) {
          <span class="mlv-day-picker__value">{{ displayValue }}</span>
        } @else {
          <span class="mlv-day-picker__placeholder">{{
            _resolvedPlaceholder()
          }}</span>
        }
        <span class="mlv-day-picker__icon">
          <svg lucideCalendar></svg>
        </span>
      </div>

      <!--
        `class` is forwarded to the overlay panel. `mlv-popup--flush` drops the
        full-screen sheet's default body inset, because `mlv-calendar-sheet`
        owns its own inline spacing throughout; it is inert while the popup is
        trigger-anchored, where `__inner` carries no padding at all.
      -->
      <mlv-popup
        #dayPopup
        [(opened)]="isOpen"
        [hasShadow]="true"
        panelRole="dialog"
        [modal]="true"
        mobileMode="auto"
        class="mlv-popup--flush"
        [mobileTitle]="label() || _i18n().selectDay"
        [ariaLabel]="label() || _resolvedPlaceholder()"
        (afterOpened)="_onPopupOpened()"
        (afterClosed)="_onPopupClosed()"
      >
        <!--
          Confirm action for the full-screen sheet. The popup stamps this slot
          only while it is full-screen, so the anchored dropdown never sees it
          and keeps committing on tap.
        -->
        <ng-template mlvPopupHeaderActions>
          <button
            type="button"
            mlvButton
            variant="primary"
            size="s"
            class="mlv-day-picker__done"
            (click)="_applyPending()"
          >
            {{ _calendarI18n().done }}
          </button>
        </ng-template>

        <ng-template mlvPopupContent>
          <div
            [id]="popupId()"
            class="mlv-day-picker__popup"
            [class.mlv-day-picker__popup--sheet]="dayPopup.isFullscreen()"
          >
            @if (dayPopup.isFullscreen()) {
              <mlv-calendar-sheet
                [(value)]="_pendingValue"
                [min]="min()"
                [max]="max()"
              />
            } @else {
              <mlv-calendar
                embedded
                [value]="value()"
                (valueChange)="onDateSelected($event)"
                [min]="min()"
                [max]="max()"
              />
            }
          </div>
        </ng-template>
      </mlv-popup>
    </mlv-popup-container>
  </ng-template>

  @if (description()) {
    <mlv-description [id]="_descriptionId()">{{
      description()
    }}</mlv-description>
  }
  @if (message()) {
    <mlv-message [id]="_messageId()" [state]="resolvedState()">
      {{ message() }}
    </mlv-message>
  }
</mlv-form-control-wrapper>
