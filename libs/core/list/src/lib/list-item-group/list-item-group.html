@if (_alwaysOpen()) {
  <!--
    Nothing here can disclose the content: either the enclosing list's variant
    holds it open, or the enclosing list claims a container role in which a
    `<button>` is not a valid owned child (see `_alwaysOpen`). A
    `<button aria-expanded>` would be a control making a false claim about
    content it does not govern (WCAG 4.1.2) and a tab stop that does nothing.
    The label is plain text instead, and — when the content region has a role
    to name — it names it.
  -->
  <div class="mlv-list-item-group__label" [id]="_labelId">{{ label() }}</div>
} @else {
  <button
    class="mlv-list-item-group__toggler"
    type="button"
    [attr.aria-expanded]="_expanded()"
    [attr.aria-controls]="_contentId"
    (click)="toggle()"
  >
    <svg class="mlv-list-item-group__arrow" size="16" lucideChevronRight></svg>
    <span>{{ label() }}</span>
  </button>
}
<!--
  The role is derived from the enclosing list's `listRole` (#224) — `list`
  under the default `role="list"` and outside any list, `group` under the four
  container roles that own one, and *nothing* under a container that owns
  neither. Read `_contentRole`'s table before changing it: this region exists to
  give the projected rows the container context their own roles require, and a
  hardcoded `role="list"` was both wrong under `role="menu"` (which owns no
  `listitem`) and unnecessary under it (`group` is what a menu section is).

  `inert` while the content is off screen (#221). Collapsing is done in CSS with
  `grid-template-rows: 0fr` + `overflow: hidden` + `opacity: 0`, none of which
  removes anything from the accessibility tree: a zero-height clipped box still
  computes `visibility: visible`, so AT kept reading the rows out and Tab kept
  landing on their links with no focus ring anywhere on screen. `inert` removes
  both — it is not a rendering property, so unlike `visibility` / `display` /
  `hidden` it needs no timing against the collapse transition and no
  reduced-motion path of its own; it simply flips with the state. It goes on
  this element rather than an inner wrapper so that the region the toggler names
  through `aria-controls` is exactly the region `aria-expanded="false"` is a
  claim about.

  The predicate is `_contentVisible()` — `_expanded() || _alwaysOpen()`. Read
  its JSDoc before touching this: `!_expanded()` looks equivalent and is not.
-->
<div
  class="mlv-list-item-group__content"
  [attr.role]="_contentRole()"
  [id]="_contentId"
  [attr.aria-labelledby]="_contentLabelledBy()"
  [attr.inert]="_contentVisible() ? null : ''"
>
  <div>
    <div>
      <ng-content />
    </div>
  </div>
</div>
