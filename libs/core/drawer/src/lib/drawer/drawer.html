<ng-template #drawerTemplate>
  <div class="mlv-drawer__backdrop"></div>
  <div
    class="mlv-drawer"
    [class]="'mlv-drawer--' + position()"
    [class.mlv-drawer--enter]="animationState() === 'enter'"
    [class.mlv-drawer--leave]="animationState() === 'leave'"
    [class.mlv-drawer--resizable]="resizable()"
    [style.width]="drawerDimensions['width']"
    [style.height]="drawerDimensions['height']"
    [style.min-width]="drawerDimensions['minWidth']"
    [style.min-height]="drawerDimensions['minHeight']"
    [style.max-width]="drawerDimensions['maxWidth']"
    [style.max-height]="drawerDimensions['maxHeight']"
    [style.--mlv-drawer-hidden-transform]="hiddenTransform()"
    (animationend)="_onPanelAnimationEnd($event)"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="_resolvedAriaLabel()"
    [attr.aria-labelledby]="_resolvedAriaLabelledBy()"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="false"
  >
    @if (resizable()) {
      <div
        class="mlv-drawer__handle"
        mlvDrawerResize
        [position]="position()"
        [snapPoints]="snapPoints()"
        (dismissed)="close()"
      >
        <span class="mlv-drawer__handle-pill" aria-hidden="true"></span>
      </div>
    }
    @if (contentRef(); as contentTpl) {
      <ng-template [ngTemplateOutlet]="contentTpl.templateRef" />
    }
  </div>
</ng-template>
