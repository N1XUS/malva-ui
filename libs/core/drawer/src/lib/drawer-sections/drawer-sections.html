@if (_hasMultipleSections()) {
  <button
    type="button"
    mlvButton
    [mlvPopupTrigger]="popup"
    [ariaHasPopup]="'menu'"
    [triggerOn]="_triggerOn"
    mlvDensity="compact"
    variant="transparent"
  >
    {{ sectionsService.currentScrolledSection()?.label() }}
    <svg lucideChevronDown mlvButtonIcon />
  </button>
  <mlv-popup #popup [(opened)]="isOpen">
    <ng-template mlvPopupContent>
      <mlv-list style="min-width: 100px" [listRole]="'menu'" appearance="menu">
        @for (section of sectionsService.normalizedSections(); track section) {
          <!-- Role written twice on purpose — `itemRole` and `MlvClick.hostRole`
               are both host `[attr.role]` bindings here; see the `hostRole`
               JSDoc in `@malva-ui/cdk/accessibility` (#223). -->
          <mlv-list-item
            itemRole="menuitem"
            [hostRole]="'menuitem'"
            (mlvClick)="navigateToSection(section.elementRef)"
          >
            {{ section.label() }}
          </mlv-list-item>
        }
      </mlv-list>
    </ng-template>
  </mlv-popup>
}
