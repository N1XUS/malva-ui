<div class="mlv-scrubber__track">
  <ul
    #listRef
    ngListbox
    class="mlv-scrubber__list"
    focusMode="activedescendant"
    selectionMode="follow"
    [orientation]="orientation()"
    [wrap]="true"
    [disabled]="disabled()"
    [tabindex]="_listboxTabIndex()"
    [value]="_ariaValue()"
    (valueChange)="_onAriaValueChange($event)"
    [attr.aria-label]="label()"
  >
    @for (item of _displayItems(); track item.value; let index = $index) {
    <li
      ngOption
      #itemRef
      [id]="_optionId(index)"
      [value]="item.value"
      [label]="item.label"
      class="mlv-scrubber__item"
      [class.mlv-scrubber__item--selected]="item.value === selectedValue()"
    >
      {{ item.label }}
    </li>
    }
  </ul>
</div>
