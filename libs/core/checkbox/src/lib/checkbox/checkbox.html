<label class="mlv-checkbox__label" [for]="inputId">
  <input
    #nativeInput
    type="checkbox"
    class="mlv-checkbox__native"
    [id]="inputId"
    [checked]="checked()"
    [disabled]="computedDisabled()"
    [attr.tabindex]="_resolvedTabIndex()"
    [attr.aria-checked]="indeterminate() ? 'mixed' : checked()"
    [attr.aria-required]="required() || null"
    [attr.aria-readonly]="readonly() || null"
    [attr.aria-label]="_resolvedAriaLabel()"
    [attr.aria-labelledby]="_resolvedAriaLabelledBy()"
    [attr.aria-invalid]="_ariaInvalid()"
    [attr.aria-describedby]="_describedBy()"
    (click)="_onNativeClick($event)"
    (change)="onInputChange($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keydown.enter)="toggle($event)"
  />
  <span
    class="mlv-checkbox__visual"
    [class]="'mlv-checkbox__visual--' + resolvedState()"
    aria-hidden="true"
  >
    @if (!indeterminate()) {
      <svg size="20" class="mlv-checkbox__check" lucideCheck />
    } @else {
      <svg size="20" class="mlv-checkbox__check" lucideMinus />
    }
  </span>
  <span class="mlv-checkbox__text">
    <!-- Projected text wins; the `label` fallback next to it is hidden by CSS
         whenever this span is non-empty, which also keeps it out of the
         accessible name computed from the wrapping <label>. -->
    <span #content class="mlv-checkbox__content"><ng-content /></span>
    @if (label()) {
      <span class="mlv-checkbox__label-text">{{ label() }}</span>
    }
  </span>
</label>
<!-- Outside the <label>, so neither text joins the accessible name; the native
     input reaches both through `aria-describedby`. -->
@if (description()) {
  <mlv-description class="mlv-checkbox__description" [id]="_descriptionId()">{{
    description()
  }}</mlv-description>
}
@if (message()) {
  <mlv-message
    class="mlv-checkbox__message"
    [id]="_messageId()"
    [state]="resolvedState()"
    >{{ message() }}</mlv-message
  >
}
