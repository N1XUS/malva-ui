<button
  #trigger
  mlvButton
  type="button"
  shape="circle"
  class="mlv-speed-dial__trigger"
  [variant]="variant()"
  [mlvDensity]="_density()"
  [id]="_triggerId"
  [disabled]="disabled()"
  aria-haspopup="menu"
  [attr.aria-expanded]="opened()"
  [attr.aria-controls]="opened() ? _menuId : null"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-labelledby]="ariaLabelledby() || null"
  (click)="_onTriggerClick($event)"
  (keydown)="_onTriggerKeydown($event)"
>
  <span
    class="mlv-speed-dial__trigger-icon"
    [class.mlv-speed-dial__trigger-icon--open]="opened()"
  >
    <span
      class="mlv-speed-dial__trigger-glyph mlv-speed-dial__trigger-glyph--open"
    >
      <ng-content select="[mlvSpeedDialTriggerIcon]">
        <svg lucidePlus [size]="20" aria-hidden="true" />
      </ng-content>
    </span>
    <span
      class="mlv-speed-dial__trigger-glyph mlv-speed-dial__trigger-glyph--close"
      aria-hidden="true"
    >
      <svg lucideX [size]="20" aria-hidden="true" />
    </span>
  </span>
</button>

<ng-template #panelTemplate>
  <div
    class="mlv-speed-dial__panel"
    [class]="_panelClass()"
    [style.--mlv-speed-dial-radius]="radius() + 'px'"
    [style.--mlv-speed-dial-stagger]="transitionDelay() + 'ms'"
    (pointerenter)="_onHoverEnter($event)"
    (pointerleave)="_onHoverLeave($event)"
  >
    <ul
      role="menu"
      tabindex="-1"
      class="mlv-speed-dial__list"
      [class]="_listClass()"
      [id]="_menuId"
      [attr.aria-labelledby]="_triggerId"
      (keydown)="_onMenuKeydown($event)"
    >
      @for (entry of _entries(); track entry.key) {
      <li
        role="none"
        class="mlv-speed-dial__item"
        [style.--mlv-speed-dial-item-x]="entry.x"
        [style.--mlv-speed-dial-item-y]="entry.y"
        [style.--mlv-stagger-index]="entry.delayIndex"
      >
        <button
          mlvButton
          type="button"
          shape="circle"
          role="menuitem"
          tabindex="-1"
          class="mlv-speed-dial__action"
          [variant]="itemVariant()"
          [mlvDensity]="_density()"
          [disabled]="entry.disabled"
          [attr.aria-label]="entry.item.label"
          [mlvTooltip]="entry.item.label"
          [tooltipDisabled]="!showTooltips()"
          [tooltipPlacement]="_tooltipPlacement()"
          (click)="_onItemClick(entry, $event)"
        >
          @if (_itemDef(); as def) {
          <ng-template
            [ngTemplateOutlet]="def.templateRef"
            [ngTemplateOutletContext]="{ $implicit: entry.item, index: entry.index }"
          />
          } @else if (entry.item.icon; as icon) {
          <svg [lucideIcon]="icon" [size]="18" aria-hidden="true" />
          }
        </button>
      </li>
      }
    </ul>
  </div>
</ng-template>
