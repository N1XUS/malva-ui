<!-- Leading context: breadcrumb, back link, icon — the author's own elements,
     in one region rather than three stacked rows. -->
<ng-content select="[mlvPageContext]" />

<div class="mlv-page-header__title-row">
  @if (_titleRef()?.templateRef; as titleTpl) {
    <!-- Two title nodes at two complete type roles, crossfaded — nothing
         interpolates a font size, so each role keeps its own tracking and its
         own weight. Exactly one of them is in the accessibility tree at any
         moment: `inert` takes the other out of the tree *and* the tab order,
         because an opacity-zero heading is still announced on the web.

         Both are `tabindex="-1"`: programmatic focus targets for
         `focusTitle()`, never tab stops. The consumer's own template must not
         carry the focus target itself, because it is instantiated here twice —
         a `tabindex`, an `id` or a control written inside it exists twice too,
         and the copy `focusTitle()` would land on is the inert one half the
         time. -->
    <div class="mlv-page-header__title">
      <div
        #titleLarge
        tabindex="-1"
        class="mlv-page-header__title-node mlv-page-header__title-node--large"
        [attr.aria-hidden]="_snapped() ? 'true' : null"
        [attr.inert]="_snapped() ? '' : null"
      >
        <ng-template [ngTemplateOutlet]="titleTpl" />
      </div>
      <div
        #titleSmall
        tabindex="-1"
        class="mlv-page-header__title-node mlv-page-header__title-node--small"
        [attr.aria-hidden]="_snapped() ? null : 'true'"
        [attr.inert]="_snapped() ? null : ''"
      >
        <ng-template [ngTemplateOutlet]="titleTpl" />
      </div>
    </div>
  }
  <ng-content select="[mlvPageStatus]" />
  <span class="mlv-page-header__spacer" aria-hidden="true"></span>
  <ng-content select="[mlvPageActions]" />
  @if (_expandControl(); as snap) {
    <button
      mlvButton
      type="button"
      variant="transparent"
      shape="circle"
      class="mlv-page-header__expand"
      data-slot="page-header-expand"
      [attr.aria-label]="expandLabel()"
      (click)="snap.expand()"
    >
      <svg lucideChevronUp [size]="16" aria-hidden="true" />
    </button>
  }
</div>

<!-- The title block collapses; the navigation does not. A snapped header that
     kept a three-line description and threw away its tabs would have discarded
     the thing the reader most needs while scrolled. Both collapsing regions
     carry their own stagger window, declared by the region, not by this
     template. -->
<ng-content select="[mlvPageDescription]" />
<ng-content select="[mlvPageMeta]" />
<ng-content select="[mlvPageTabs]" />

<!-- A projected summary strip renders as the chrome's bottom row, sharing
     this header's single glass surface. -->
<ng-content select="mlv-page-summary" />
