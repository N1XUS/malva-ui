@if (lane() && continuesBefore()) {
<svg
  class="mlv-scheduler-event__continuation mlv-scheduler-event__continuation--before"
  lucideChevronLeft
  [size]="12"
  aria-hidden="true"
></svg>
} @if (_ctx.eventDef(); as def) {
<ng-container *ngTemplateOutlet="def; context: _defContext()" />
} @else { @if (!normalized().allDay) {
<span class="mlv-scheduler-event__time"><bdi>{{ _timeText() }}</bdi></span>
}
<span class="mlv-scheduler-event__title">{{ event().title }}</span>
} @if (lane() && continuesAfter()) {
<svg
  class="mlv-scheduler-event__continuation mlv-scheduler-event__continuation--after"
  lucideChevronRight
  [size]="12"
  aria-hidden="true"
></svg>
} @if (_resizable()) { @if (!continuesBefore()) {
<span
  class="mlv-scheduler-event__resize-handle mlv-scheduler-event__resize-handle--start"
  #startHandle
  aria-hidden="true"
  ><span class="mlv-scheduler-event__grip"></span
></span>
} @if (!continuesAfter()) {
<span
  class="mlv-scheduler-event__resize-handle mlv-scheduler-event__resize-handle--end"
  #endHandle
  aria-hidden="true"
  ><span class="mlv-scheduler-event__grip"></span
></span>
} }
