<mlv-toolbar
  mlvToolbarRoving
  [disabled]="disabled()"
  [softDisabled]="false"
  [attr.aria-label]="_resolvedAriaLabel()"
>
  @if (startTemplate(); as template) {
  <ng-container
    [ngTemplateOutlet]="template"
    [ngTemplateOutletContext]="{ $implicit: context() }"
  />
  }
  <span #_startSlotAnchor class="mlv-editor-toolbar__slot-anchor"></span>
  <mlv-editor-undo-redo />
  <mlv-editor-heading />
  <mlv-editor-list />
  <mlv-editor-inline-marks />
  <mlv-editor-text-color />
  <mlv-editor-highlight />
  <mlv-editor-alignment />
  <mlv-editor-link />
  <mlv-editor-image-upload />
  <mlv-editor-table />
  <mlv-editor-block-insert />
  <span #_endSlotAnchor class="mlv-editor-toolbar__slot-anchor"></span>
  @if (endTemplate(); as template) {
  <ng-container
    [ngTemplateOutlet]="template"
    [ngTemplateOutletContext]="{ $implicit: context() }"
  />
  }
  <ng-content />
</mlv-toolbar>
