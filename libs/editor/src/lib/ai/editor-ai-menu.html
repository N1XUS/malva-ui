<!-- The trigger is declared once and rendered by whichever branch applies:
  `mlv-popup-container` requires a popup content child, so it cannot wrap the
  trigger when the custom prompt is dropped. -->
<ng-template #_trigger>
  <button
    #_triggerElement
    mlvButton
    mlvEditorToolbarWidget
    type="button"
    shape="square"
    mlvDensity="tight"
    variant="transparent"
    [disabled]="_disabled()"
    [mlvMenuTrigger]="_menu"
    [menuTriggerDisabled]="_disabled() || _running()"
    [attr.aria-label]="_running() ? _copy().aiCancel : _copy().aiMenu"
    [mlvTooltip]="_running() ? _copy().aiCancel : _copy().aiMenu"
    (click)="_onTriggerClick()"
    (menuOpened)="_registerMenuOverlay()"
    (menuClosed)="_unregisterMenuOverlay()"
  >
    @if (_running()) {
      <svg mlvButtonIcon lucideCircleStop aria-hidden="true" />
    } @else {
      <svg mlvButtonIcon lucideSparkles aria-hidden="true" />
    }
  </button>
</ng-template>

@if (showCustomPrompt()) {
  <mlv-popup-container class="mlv-editor-ai-menu__anchor">
    <ng-container [ngTemplateOutlet]="_trigger" />

    <mlv-popup
      #_popup
      panelRole="dialog"
      [modal]="true"
      [position]="['bottom-start', 'top-start', 'bottom-end', 'top-end']"
      [ariaLabel]="_copy().aiCustom"
      (afterOpened)="_onPromptOpened()"
      (afterClosed)="_onPromptClosed()"
    >
      <ng-template mlvPopupContent>
        <div
          #_panel
          mlvEditorAiPromptPanel
          [(instruction)]="_instruction"
          [(output)]="_output"
          [disabled]="_disabled()"
          [applyBlocked]="_itemsDisabled()"
          (submitted)="_apply()"
          (dismissed)="_closePrompt()"
        ></div>
      </ng-template>
    </mlv-popup>
  </mlv-popup-container>
} @else {
  <ng-container [ngTemplateOutlet]="_trigger" />
}

<mlv-menu #_menu [label]="_copy().aiMenu">
  <!-- Tracked by index: a host-authored list may repeat a kind, so the kind
    is not an identity. -->
  @for (action of _actions(); track $index) {
    <mlv-list-item
      mlvMenuItem
      [disabled]="_itemsDisabled()"
      (itemClick)="_runAction(action)"
    >
      {{ action.label }}
    </mlv-list-item>
  }
  @if (showCustomPrompt()) {
    <mlv-list-item
      mlvMenuItem
      [disabled]="_itemsDisabled()"
      (itemClick)="_openPrompt()"
    >
      {{ _copy().aiCustom }}
    </mlv-list-item>
  }
</mlv-menu>
