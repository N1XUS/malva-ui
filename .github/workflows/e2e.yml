name: E2E

# Split out of CI: e2e is the slowest target in the workspace and needs a
# Playwright browser download, so it does not run on every push. Trigger it
# before a release, or after touching a component with an e2e suite
# (core-button, core-checkbox, editor).
#
# To run it on a schedule instead, uncomment the block below. Note this
# repository is private, so scheduled runs consume billable Actions minutes.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 3 * * 1' # Mondays, 03:00 UTC

# Two e2e runs on one ref are redundant, and this is the most expensive
# workflow in the repo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # The workspace declares "packageManager": "yarn@4.x". Corepack has to be
      # enabled *before* setup-node, because setup-node's yarn cache probe shells
      # out to `yarn --version` / `yarn cache dir` and the runner's global Yarn is 1.x.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      # node_modules itself, not just the Yarn download cache that setup-node
      # keeps: canvas is a native module, so a clean install makes node-gyp
      # rebuild it every run. The key covers the OS, the Node line and the
      # lockfile, because a cached native build is only valid for the ABI it
      # was compiled against.
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('yarn.lock') }}

      - run: yarn install --immutable
      - run: npx playwright install --only-shell

      - run: npx nx run-many -t e2e
