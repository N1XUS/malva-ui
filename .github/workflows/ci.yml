name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same branch makes the older run pointless — cancel it
# rather than paying for both. Grouping by ref keeps main and each PR separate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # The workspace declares "packageManager": "yarn@4.x". Corepack has to be
      # enabled *before* setup-node, because setup-node's yarn cache probe shells
      # out to `yarn --version` / `yarn cache dir` and the runner's global Yarn is 1.x.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --immutable

      # e2e is deliberately absent — it is the slowest target and needs a browser
      # download, so it lives in its own manually-triggered workflow (e2e.yml).
      # test-schematics is the `ng add` installer's Node-only harness; it has its
      # own target because it must not run in the Angular test environment.
      - run: npx nx run-many -t lint test test-schematics build typecheck
