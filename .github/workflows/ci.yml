name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A newer push to the same branch makes the older run pointless — cancel it
# rather than paying for both. Grouping by ref keeps main and each PR separate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # The workspace declares "packageManager": "yarn@4.x". Corepack has to be
      # enabled *before* setup-node, because setup-node's yarn cache probe shells
      # out to `yarn --version` / `yarn cache dir` and the runner's global Yarn is 1.x.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      # node_modules itself, not just the Yarn download cache that setup-node
      # keeps: canvas is a native module, so a clean install makes node-gyp
      # rebuild it every run. The key covers the OS, the Node line and the
      # lockfile, because a cached native build is only valid for the ABI it
      # was compiled against.
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('yarn.lock') }}

      - run: yarn install --immutable

      # e2e is deliberately absent — it is the slowest target and needs a browser
      # download, so it lives in its own manually-triggered workflow (e2e.yml).
      # test-schematics is the `ng add` installer's Node-only harness; it has its
      # own target because it must not run in the Angular test environment.

      # A pull request only has to prove that what it touched still works, so it
      # runs the affected graph rather than all 70-odd projects. `--head=HEAD` is
      # the merge result the PR would produce, not `head.sha`: comparing against
      # the merge commit can only ever over-select (main commits landed since the
      # base tip look changed too), and over-selecting is safe where
      # under-selecting is not.
      - name: Verify affected projects
        if: github.event_name == 'pull_request'
        run: npx nx affected -t lint test test-schematics build typecheck --base=${{ github.event.pull_request.base.sha }} --head=HEAD --exclude=docs

      # Pushes to main verify everything. main is the branch every PR bases off
      # and the one release cuts from, so it must never be only partially
      # verified — and after the PR run most targets are already cache hits.
      - name: Verify all projects
        if: github.event_name != 'pull_request'
        run: npx nx run-many -t lint test test-schematics build typecheck --exclude=docs

      # `docs` gets the runner to itself. It is the heaviest project in the
      # workspace by a wide margin — 36 spec files, 339 tests, axe scans over
      # whole showcase pages, and specs that lazy-load the editor page and pull
      # the entire Tiptap graph through Vite's transform. Its memory is
      # dominated by that transform graph in the Vitest *main* process, which no
      # worker cap shrinks, so sharing 16GB and 4 vCPU with the other jsdom
      # suites got its worker OOM-killed ("Worker exited unexpectedly", no V8
      # heap message — the kernel, not V8) and starved the neighbours it did not
      # kill. Running it in its own step costs little: everything it depends on
      # is already a cache hit from the step above.
      # `--projects` is a `run-many` filter, not an `affected` one: `nx affected`
      # forwards it to the target's own command instead (`tsc` answers with
      # "error TS5023: Unknown compiler option '--projects=docs'") and still
      # runs the whole affected graph, which defeats the isolation. So this is
      # `run-many`, unconditionally. Nothing is lost by not scoping it to the
      # affected set: `docs` depends on nearly every library, so it is affected
      # by almost any change, and when it genuinely is not, every task here is a
      # cache hit.
      - name: Verify the docs app
        run: npx nx run-many -t lint test build typecheck --projects=docs
