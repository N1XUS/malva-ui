<header class="docs-app-bar">
  <a class="docs-app-bar__skip-link" href="#main-content">Skip to content</a>
  <nav mlvActionBar fixed aria-label="Primary">
    <!-- Leading slot: the documentation shell puts its navigation trigger here. -->
    <ng-content select="[docsAppBarLeading]" />
    <!-- The brand text is hidden below the mobile breakpoint, and the logo is
         decorative (alt=""), so the link carries its own name. It is stated
         explicitly rather than derived from the text so that the name is
         identical at every viewport, and it starts with the visible label
         ("Malva UI") to satisfy WCAG 2.5.3 Label in Name. -->
    <a mlvActionBarLogo routerLink="/" aria-label="Malva UI home">
      <img ngSrc="/malva-ui-logo.png" width="37" height="40" priority alt="" />
      <span class="docs-app-bar__brand">Malva UI</span>
    </a>
    <mlv-segmented
      class="docs-app-bar__primary"
      ariaLabel="Documentation areas"
    >
      <a mlvSegmentedItem routerLink="/" [active]="docsActive()">Docs</a>
      <a mlvSegmentedItem routerLink="/showcases" [active]="showcasesActive()"
        >Showcases</a
      >
    </mlv-segmented>
    <mlv-spacer />
    <div
      class="docs-app-bar__global-controls"
      role="group"
      aria-label="Display preferences"
    >
      <a
        mlvButton
        shape="square"
        variant="transparent"
        mlvDensity="compact"
        href="https://github.com/N1XUS/malva-ui"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View Malva UI on GitHub (opens in a new tab)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M12 .297c-6.63 0-12 5.373-12 12c0 5.303 3.438 9.8 8.205 11.385c.6.113.82-.258.82-.577c0-.285-.01-1.04-.015-2.04c-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729c1.205.084 1.838 1.236 1.838 1.236c1.07 1.835 2.809 1.305 3.495.998c.108-.776.417-1.305.76-1.605c-2.665-.3-5.466-1.332-5.466-5.93c0-1.31.465-2.38 1.235-3.22c-.135-.303-.54-1.523.105-3.176c0 0 1.005-.322 3.3 1.23c.96-.267 1.98-.399 3-.405c1.02.006 2.04.138 3 .405c2.28-1.552 3.285-1.23 3.285-1.23c.645 1.653.24 2.873.12 3.176c.765.84 1.23 1.91 1.23 3.22c0 4.61-2.805 5.625-5.475 5.92c.42.36.81 1.096.81 2.22c0 1.606-.015 2.896-.015 3.286c0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
          />
        </svg>
      </a>
      <docs-app-bar-preferences />
    </div>
  </nav>
</header>
