<div class="demo-row" style="flex-wrap: wrap; align-items: center; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="min-width: 80px; font-size: 0.8125rem; opacity: 0.6"
        >cmd / ctrl</span
      >
      <mlv-kbd [keys]="['cmd']" />
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="min-width: 80px; font-size: 0.8125rem; opacity: 0.6"
        >shift</span
      >
      <mlv-kbd [keys]="['shift']" />
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="min-width: 80px; font-size: 0.8125rem; opacity: 0.6"
        >alt</span
      >
      <mlv-kbd [keys]="['alt']" />
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="min-width: 80px; font-size: 0.8125rem; opacity: 0.6"
        >enter</span
      >
      <mlv-kbd [keys]="['enter']" />
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="min-width: 80px; font-size: 0.8125rem; opacity: 0.6"
        >backspace</span
      >
      <mlv-kbd [keys]="['backspace']" />
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="min-width: 80px; font-size: 0.8125rem; opacity: 0.6"
        >arrows</span
      >
      <mlv-kbd [keys]="['up']" />
      <mlv-kbd [keys]="['down']" />
      <mlv-kbd [keys]="['left']" />
      <mlv-kbd [keys]="['right']" />
    </div>
  </div>
</div>
