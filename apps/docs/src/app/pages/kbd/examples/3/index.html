<div
  class="demo-column"
  style="display: flex; flex-direction: column; gap: 12px; max-width: 480px"
>
  <p style="margin: 0; font-size: 0.9375rem; line-height: 1.6">
    Press <mlv-kbd [keys]="['cmd', 'k']" /> to open the command palette.
  </p>
  <p style="margin: 0; font-size: 0.9375rem; line-height: 1.6">
    Use <mlv-kbd [keys]="['up']" /> and <mlv-kbd [keys]="['down']" /> to
    navigate, then <mlv-kbd [keys]="['enter']" /> to confirm.
  </p>
  <p style="margin: 0; font-size: 0.9375rem; line-height: 1.6">
    Hit <mlv-kbd [keys]="['escape']" /> to dismiss.
  </p>
</div>
