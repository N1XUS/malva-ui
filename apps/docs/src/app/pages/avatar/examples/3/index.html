<div style="display: flex; align-items: flex-end; gap: 1.5rem; flex-wrap: wrap">
  <mlv-avatar size="m" label="User">
    <svg lucideUser [size]="20" />
  </mlv-avatar>

  <mlv-avatar size="m" shape="circle" label="Profile">
    <svg lucideUserRound [size]="20" />
  </mlv-avatar>

  <mlv-avatar size="l" shape="square" label="Account">
    <svg lucideUserCircle2 [size]="28" />
  </mlv-avatar>

  <mlv-avatar size="l" shape="circle" color="hsl(253, 60%, 80%)" label="Bot">
    <svg lucideBot [size]="28" />
  </mlv-avatar>

  <mlv-avatar
    size="xl"
    shape="square"
    color="hsl(140, 60%, 82%)"
    label="System"
  >
    <svg lucideBot [size]="36" />
  </mlv-avatar>
</div>
