<div class="demo-row" style="align-items: flex-end; gap: 2rem; flex-wrap: wrap">
  <div class="demo-col" style="align-items: center; gap: 0.5rem">
    <mlv-loader
      variant="circle"
      [indeterminate]="true"
      [size]="80"
      [strokeWidth]="6"
    />
    <span style="font-size: 0.75rem; opacity: 0.6">80px</span>
  </div>
  <div class="demo-col" style="align-items: center; gap: 0.5rem">
    <mlv-loader variant="circle" [indeterminate]="true" [size]="48" />
    <span style="font-size: 0.75rem; opacity: 0.6">48px (default)</span>
  </div>
  <div class="demo-col" style="align-items: center; gap: 0.5rem">
    <mlv-loader
      variant="circle"
      [indeterminate]="true"
      [size]="32"
      [strokeWidth]="3"
    />
    <span style="font-size: 0.75rem; opacity: 0.6">32px</span>
  </div>
  <div class="demo-col" style="align-items: center; gap: 0.5rem">
    <mlv-loader
      variant="circle"
      [indeterminate]="true"
      [size]="20"
      [strokeWidth]="2"
    />
    <span style="font-size: 0.75rem; opacity: 0.6">20px</span>
  </div>
  <div class="demo-col" style="align-items: center; gap: 0.5rem">
    <mlv-loader
      variant="circle"
      [indeterminate]="true"
      tone="success"
      [size]="48"
    />
    <span style="font-size: 0.75rem; opacity: 0.6">success</span>
  </div>
  <div class="demo-col" style="align-items: center; gap: 0.5rem">
    <mlv-loader
      variant="circle"
      [indeterminate]="true"
      tone="danger"
      [size]="48"
    />
    <span style="font-size: 0.75rem; opacity: 0.6">error</span>
  </div>
</div>
