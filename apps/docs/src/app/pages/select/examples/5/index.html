<div class="demo-col">
  <div class="demo-row">
    @for (level of densityLevels; track level) {
      <button
        mlvButton
        type="button"
        [variant]="density() === level ? 'primary' : 'secondary'"
        (click)="density.set(level)"
      >
        {{ level }}
      </button>
    }
  </div>
  <form
    mlvForm
    [mlvDensity]="density()"
    aria-label="Team"
    style="max-width: 28rem"
  >
    <mlv-select
      label="Department"
      [options]="options"
      placeholder="Select a department..."
    />
  </form>
</div>
