<div class="demo-col">
  <div class="demo-row">
    @for (level of densityLevels; track level) {
    <button
      mlvButton
      [variant]="densityService.density() === level ? 'primary' : 'secondary'"
      (click)="densityService.setDensity(level)"
    >
      {{ level }}
    </button>
    }
  </div>
  <div
    class="demo-col"
    style="gap: 0.75rem; align-items: stretch; max-width: 28rem"
  >
    <div mlvDensityRoot>
      <mlv-select
        label="Department"
        [options]="options"
        placeholder="Select a department..."
      />
    </div>
  </div>
</div>
