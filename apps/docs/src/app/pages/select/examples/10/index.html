<div
  class="demo-col"
  style="gap: 0.75rem; align-items: stretch; max-width: 28rem"
>
  <mlv-select
    label="Country"
    [options]="countries"
    [formField]="fields.country"
  />

  <p style="margin: 0; color: var(--mlv-text-secondary)">
    Value: {{ fields.country().value() }} · Touched: {{
    fields.country().touched() }}
  </p>
</div>
