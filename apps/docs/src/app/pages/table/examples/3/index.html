    mlvTable

    hoverable="cell"
    aria-label="Activity history"
  >
    <caption>
      Activity history
    </caption>
    <thead>
      <tr>
        <th scope="col">Event</th>
        <th scope="col">Actor</th>
        <th scope="col">Workspace</th>
        <th scope="col">Device</th>
        <th scope="col">IP address</th>
        <th scope="col">Time</th>
      </tr>
    </thead>

      <tr>
        <td mlvTableCell>Exported report</td>

        <td mlvTableCell>Analytics</td>
        <td mlvTableCell>Chrome on Windows</td>
        <td mlvTableCell>198.51.100.17</td>
        <td mlvTableCell>09:18</td>
      </tr>
      <tr>
        <td mlvTableCell>Changed permissions</td>
