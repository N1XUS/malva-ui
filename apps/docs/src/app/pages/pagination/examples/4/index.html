<div class="demo-col">
  <table class="pagination-demo-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Department</th>
        <th>Role</th>
      </tr>
    </thead>
    <tbody>
      @for (row of visibleRows(); track row.id) {
        <tr>
          <td>{{ row.id }}</td>
          <td>{{ row.name }}</td>
          <td>{{ row.department }}</td>
          <td>{{ row.role }}</td>
        </tr>
      }
    </tbody>
  </table>

  <mlv-pagination
    [totalItems]="allEmployees.length"
    [(currentPage)]="currentPage"
    [(itemsPerPage)]="activeItemsPerPage"
    [perPageOptions]="availableOptions"
  />
</div>
