<div class="demo-col" style="align-items: stretch; gap: 1rem">
  <div class="demo-row">
    <button
      mlvButton
      type="button"
      [variant]="readonly() ? 'primary' : 'outlined'"
      (click)="readonly.update(value => !value)"
    >
      Readonly: {{ readonly() }}
    </button>
    <button
      mlvButton
      type="button"
      [variant]="disabled() ? 'primary' : 'outlined'"
      (click)="disabled.update(value => !value)"
    >
      Disabled: {{ disabled() }}
    </button>
  </div>

  <mlv-editor
    [(value)]="value"
    [readonly]="readonly()"
    [disabled]="disabled()"
    label="Event playground"
    ariaLabel="Editor event playground"
    (focus)="log('focus')"
    (blur)="log('blur')"
    (selectionChange)="log('selection: ' + $event.editor.state.selection.from)"
    (transaction)="log('transaction: ' + $event.transaction.steps.length)"
    (editorError)="log('error: ' + $event.message)"
  />

  <ol aria-live="polite">
    @for (event of events(); track $index) {
      <li>{{ event }}</li>
    } @empty {
      <li>No events yet.</li>
    }
  </ol>
</div>
