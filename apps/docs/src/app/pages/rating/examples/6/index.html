<div class="demo-col" style="gap: 1rem; align-items: flex-start">
  <mlv-rating [formField]="ratingForm.score" />

  <div class="demo-row" style="gap: 0.75rem; align-items: center">
    <button
      mlvButton
      type="button"
      variant="secondary"
      (click)="toggleDisabled()"
    >
      {{ isDisabled() ? 'Enable' : 'Disable' }}
    </button>
    <span style="color: var(--mlv-text-secondary)">
      Value: {{ ratingForm.score().value() }} · Touched:
      {{ ratingForm.score().touched() }}
    </span>
  </div>
</div>
