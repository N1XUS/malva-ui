<div class="demo-col" style="gap: 1.5rem">
  <mlv-pin-input
    [length]="4"
    type="password"
    label="Security PIN"
    hint="Keep this private"
    [(ngModel)]="pin"
  />

  <mlv-pin-input
    [length]="4"
    type="password"
    label="Confirm PIN"
    [state]="confirmState()"
    [message]="confirmMessage()"
    [(ngModel)]="confirmed"
  />
</div>
