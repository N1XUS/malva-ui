<div
  class="demo-row"
  style="
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    max-width: 20rem;
  "
>
  <mlv-input
    label="Fruit"
    placeholder="Type to search…"
    [mlvAutocomplete]="fruits"
    (optionSelected)="onPick($event)"
  />
  @if (selected(); as value) {
  <p style="margin: 0; color: var(--mlv-text-secondary)">
    Selected: {{ value }}
  </p>
  }
</div>
