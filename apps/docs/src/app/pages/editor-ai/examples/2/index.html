<div class="demo-col" style="align-items: stretch; gap: 1rem">
  <mlv-editor
    docsAiReviewGate
    #gate="docsAiReviewGate"
    [aiProvider]="aiProvider"
    [(value)]="value"
    label="AI review"
    ariaLabel="Editor with reviewable AI suggestions"
  >
    <mlv-editor-ai-menu mlvEditorToolbarStart />
    <mlv-editor-ai-review-bar mlvEditorStatus />
  </mlv-editor>

  <div class="demo-row" style="align-items: center">
    <button
      mlvButton
      type="button"
      variant="primary"
      [disabled]="gate.ai.hasPendingSuggestions()"
      (click)="save()"
    >
      Save draft
    </button>
    @if (gate.ai.hasPendingSuggestions()) {
      <span>Resolve the pending suggestions to enable saving.</span>
    }
  </div>

  <p aria-live="polite">
    @if (savedValue(); as saved) {
      Saved: {{ saved }}
    } @else {
      Nothing saved yet.
    }
  </p>
</div>
