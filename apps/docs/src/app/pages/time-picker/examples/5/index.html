<div
  class="demo-row"
  style="align-items: flex-start; gap: 2rem; flex-wrap: wrap"
>
  <!-- Statically disabled via attribute -->
  <div class="demo-col" style="align-items: flex-start; gap: 0.5rem">
    <mlv-time-picker
      label="Office closing time"
      hint="Read-only — cannot be changed"
      [formControl]="fixedTimeCtrl"
    />
  </div>

  <!-- Disabled via FormControl — toggleable -->
  <div class="demo-col" style="align-items: flex-start; gap: 1rem">
    <mlv-time-picker
      label="Appointment time"
      [formControl]="appointmentControl"
    />
    <button
      type="button"
      style="
        padding: 0.5rem 1rem;
        border-radius: var(--mlv-radius-s);
        border: 1px solid var(--mlv-border-normal);
        background: var(--mlv-background-neutral-1);
        color: var(--mlv-text-primary);
        cursor: pointer;
        font-size: var(--mlv-typography-body-s-size);
      "
      (click)="toggleDisabled()"
    >
      {{ isDisabled() ? 'Enable' : 'Disable' }} picker
    </button>
  </div>
</div>
