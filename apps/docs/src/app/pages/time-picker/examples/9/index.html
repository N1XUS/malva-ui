<div
  class="demo-row"
  style="align-items: flex-start; gap: 2rem; flex-wrap: wrap"
>
  <div class="demo-col" style="align-items: stretch; gap: 0.5rem; width: 14rem">
    <mlv-time-picker
      label="Reminder"
      placeholder="No reminder"
      clearable
      [(value)]="reminder"
    />
    <p style="margin: 0; color: var(--mlv-text-secondary)">
      Value: "{{ reminder() }}"
    </p>
  </div>

  <div class="demo-col" style="align-items: stretch; gap: 0.5rem; width: 14rem">
    <mlv-time-picker
      label="Arrival"
      defaultToNow
      clearable
      [(value)]="arrival"
    />
    <p style="margin: 0; color: var(--mlv-text-secondary)">
      Value: "{{ arrival() }}"
    </p>
  </div>
</div>
