<form
  [formGroup]="form"
  class="demo-col"
  style="align-items: flex-start; gap: 1.5rem"
>
  <div
    class="demo-row"
    style="align-items: flex-start; gap: 2rem; flex-wrap: wrap"
  >
    <mlv-time-picker label="Shift start" formControlName="startTime" />
    <mlv-time-picker label="Shift end" formControlName="endTime" />
  </div>

  <pre
    style="
      background: var(--mlv-background-subtle);
      border: 1px solid var(--mlv-border-subtle);
      border-radius: var(--mlv-radius-m);
      padding: 0.75rem 1rem;
      font-size: 0.8125rem;
      font-family: var(--mlv-typography-family-code);
      color: var(--mlv-text-primary);
      margin: 0;
    "
  >
{{ formValue }}</pre
  >

  <button
    type="button"
    style="
      padding: 0.5rem 1rem;
      border-radius: var(--mlv-radius-s);
      border: 1px solid var(--mlv-border-normal);
      background: var(--mlv-background-neutral-1);
      color: var(--mlv-text-primary);
      cursor: pointer;
      font-size: var(--mlv-typography-body-s-size);
    "
    (click)="reset()"
  >
    Reset
  </button>
</form>
