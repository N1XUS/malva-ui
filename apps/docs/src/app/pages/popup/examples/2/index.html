<div
  style="
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  "
>
  <div
    style="
      display: flex;
      gap: 0.375rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 30rem;
    "
  >
    @for (pos of positions; track pos) {
    <button
      mlvButton
      size="s"
      [variant]="selectedPosition() === pos ? 'primary' : 'outlined'"
      (click)="selectedPosition.set(pos)"
    >
      {{ pos }}
    </button>
    }
  </div>

  <div style="padding: 1.5rem 0">
    <button mlvButton [mlvPopupTrigger]="positionPopup" [ariaHasPopup]="null">
      Open popup
    </button>
    <mlv-popup #positionPopup [position]="selectedPosition()" [hasArrow]="true">
      <ng-template mlvPopupContent>
        <div style="padding: 0.75rem 1rem; text-align: center; min-width: 9rem">
          <div
            style="
              font-size: 0.75rem;
              color: var(--mlv-text-secondary);
              margin-bottom: 0.25rem;
            "
          >
            Active position
          </div>
          <strong>{{ selectedPosition() }}</strong>
        </div>
      </ng-template>
    </mlv-popup>
  </div>
</div>
