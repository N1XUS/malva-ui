<mlv-toolbar
  mlvToolbarRoving
  [gap]="0.25"
  style="border: 1px dashed var(--mlv-border-normal, #ccc); padding: 8px"
>
  <button mlvButton mlvToolbarWidget>Cut</button>
  <button mlvButton variant="outlined" mlvToolbarWidget>Copy</button>
  <button mlvButton variant="outlined" mlvToolbarWidget>Paste</button>
  <mlv-toolbar-spacer />
  <button mlvButton variant="secondary" mlvToolbarWidget>Undo</button>
</mlv-toolbar>
