@let current = tile();
<mlv-tile #tileRef [tile]="current" mlvDensity="comfortable">
  <ng-template mlvTileHeader>
    @if (editing()) {
    <mlv-input
      #titleInput
      class="docs-tile-tree-node__editor"
      [value]="current.props.title"
      [ariaLabel]="'Rename ' + current.props.title"
      autofocus
      (keydown.enter)="
          saveTitle(tileRef, current.props, titleInput.value())
        "
      (keydown.escape)="cancelTitle()"
    />
    } @else {
    <strong class="docs-tile-tree-node__title">
      {{ current.props.title }}
    </strong>
    }
  </ng-template>

  <ng-template mlvTileActions>
    <button
      mlvButton
      mlvDensity="compact"
      shape="circle"
      variant="transparent"
      type="button"
      [attr.aria-label]="'Edit ' + current.props.title"
      (click)="editing.set(true)"
    >
      <svg lucidePencil mlvButtonIcon />
    </button>
    <mlv-switch
      mlvDensity="compact"
      [checked]="current.props.enabled"
      [ariaLabel]="'Publish ' + current.props.title"
      (checkedChange)="
        tileRef.setProps({ ...current.props, enabled: $event })
      "
    />
  </ng-template>

  <ng-template mlvTileTrailingActions>
    <button
      mlvButton
      mlvDensity="compact"
      shape="circle"
      variant="transparent"
      type="button"
      [attr.aria-label]="'Remove ' + current.props.title"
      (click)="tileRef.remove()"
    >
      <svg lucideTrash2 mlvButtonIcon />
    </button>
  </ng-template>

  <span class="docs-tile-tree-node__details">
    <span class="docs-tile-tree-node__meta">
      <svg
        [lucideIcon]="
          metadataIcons[current.props.blockType ?? current.props.kind]
        "
        [size]="14"
        aria-hidden="true"
      />
      <span>{{ current.props.blockType ?? current.props.kind }}</span>
    </span>
    <span class="docs-tile-tree-node__summary">
      {{ current.props.summary }}
    </span>
  </span>

  @if (current.acceptsChildren) {
  <mlv-tiles layout="grid">
    @for (child of current.children; track child.id) {
    <docs-tile-tree-node [tile]="child" />
    }
  </mlv-tiles>
  }
</mlv-tile>
