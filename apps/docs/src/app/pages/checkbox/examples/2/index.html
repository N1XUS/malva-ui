<div style="display: flex; flex-direction: column; gap: 8px">
  <mlv-checkbox state="default">Default</mlv-checkbox>
  <mlv-checkbox state="success">Success</mlv-checkbox>
  <mlv-checkbox state="error">Error</mlv-checkbox>
  <mlv-checkbox state="warning">Warning</mlv-checkbox>
  <mlv-checkbox [indeterminate]="true">Indeterminate</mlv-checkbox>
  <mlv-checkbox [disabled]="true">Disabled</mlv-checkbox>
</div>
