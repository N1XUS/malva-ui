<div class="demo-col" style="align-items: flex-start; gap: 1rem">
  @for (density of densities; track density) {
    <div class="demo-col" style="align-items: flex-start; gap: 0.5rem">
      <span
        [id]="'button-toggle-density-' + density"
        style="font-size: 0.75rem; font-weight: 500; text-transform: capitalize"
      >
        {{ density }}
      </span>
      <mlv-button-group
        [attr.aria-labelledby]="'button-toggle-density-' + density"
      >
        <mlv-button-toggle [mlvDensity]="density" [pressed]="true">
          Bold
        </mlv-button-toggle>
        <mlv-button-toggle [mlvDensity]="density">Italic</mlv-button-toggle>
        <mlv-button-toggle [mlvDensity]="density">Underline</mlv-button-toggle>
      </mlv-button-group>
    </div>
  }
</div>
