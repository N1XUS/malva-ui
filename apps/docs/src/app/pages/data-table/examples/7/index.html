<mlv-data-table
  [data]="reports"
  [columns]="columns"
  [columnGroups]="columnGroups"
>
  <span
    *mlvDataTableCell="'q1Revenue'; let row from reports"
    class="dt-currency"
  >
    {{ formatCurrency(row.q1Revenue) }}
  </span>
  <span
    *mlvDataTableCell="'q1Expenses'; let row from reports"
    class="dt-currency"
  >
    {{ formatCurrency(row.q1Expenses) }}
  </span>
  <span
    *mlvDataTableCell="'q1Profit'; let row from reports"
    class="dt-currency"
    [class.dt-currency--negative]="row.q1Profit < 0"
    [class.dt-currency--positive]="row.q1Profit > 0"
  >
    {{ formatCurrency(row.q1Profit) }}
  </span>

  <span
    *mlvDataTableCell="'q2Revenue'; let row from reports"
    class="dt-currency"
  >
    {{ formatCurrency(row.q2Revenue) }}
  </span>
  <span
    *mlvDataTableCell="'q2Expenses'; let row from reports"
    class="dt-currency"
  >
    {{ formatCurrency(row.q2Expenses) }}
  </span>
  <span
    *mlvDataTableCell="'q2Profit'; let row from reports"
    class="dt-currency"
    [class.dt-currency--negative]="row.q2Profit < 0"
    [class.dt-currency--positive]="row.q2Profit > 0"
  >
    {{ formatCurrency(row.q2Profit) }}
  </span>

  <ng-template
    mlvDataTableCell="yoyGrowth"
    [mlvDataTableCellFrom]="reports"
    let-row
  >
    <span
      class="dt-growth"
      [class.dt-growth--positive]="row.yoyGrowth.startsWith('+')"
      [class.dt-growth--negative]="row.yoyGrowth.startsWith('-')"
    >
      {{ row.yoyGrowth }}
    </span>
  </ng-template>
</mlv-data-table>
