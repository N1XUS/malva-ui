<div style="display: flex; gap: 0.5rem; margin-bottom: 0.75rem">
  <button
    mlvButton
    variant="primary"
    type="button"
    (click)="fail()"
    [disabled]="isLoading()"
  >
    Simulate failure
  </button>
  <button
    mlvButton
    variant="secondary"
    type="button"
    (click)="customTemplate.set(!customTemplate())"
  >
    {{ customTemplate() ? 'Use default block' : 'Use custom template' }}
  </button>
</div>

@if (customTemplate()) {
<mlv-data-table
  [data]="rows()"
  [columns]="columns"
  [error]="error()"
  [loading]="isLoading()"
  (retry)="reload()"
>
  <ng-template mlvDataTableError let-message let-retry="retry">
    <p style="margin: 0 0 0.75rem">{{ message }}</p>
    <button mlvButton variant="primary" type="button" (click)="retry()">
      Reload invoices
    </button>
  </ng-template>
</mlv-data-table>
} @else {
<mlv-data-table
  [data]="rows()"
  [columns]="columns"
  [error]="error()"
  [loading]="isLoading()"
  (retry)="reload()"
/>
}
