<mlv-chat
  style="
    height: 26rem;
    border: 1px solid var(--mlv-border-normal);
    border-radius: var(--mlv-radius-m);
  "
  [messages]="messages()"
  [users]="users"
  selfId="me"
  [loading]="loading()"
  [loadingOlder]="loadingOlder()"
  [hasOlder]="hasOlder()"
  [typingUsers]="typingUsers()"
  [windowSize]="30"
  (loadOlder)="onLoadOlder()"
/>
<button mlvButton style="margin-top: 8px" (click)="simulateIncoming()">
  Simulate incoming message
</button>
