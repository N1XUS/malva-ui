<mlv-chat
  style="
    height: 28rem;
    border: 1px solid var(--mlv-border-normal);
    border-radius: var(--mlv-radius-m);
  "
  [messages]="messages()"
  [users]="users"
  selfId="me"
  (mediaClick)="onMediaClick($event)"
/>
<p style="margin-top: 8px; color: var(--mlv-text-secondary)">
  Last opened attachment: {{ lastClicked() }}
</p>
