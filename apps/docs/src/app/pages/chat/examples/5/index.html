<mlv-chat
  style="
    height: 26rem;
    border: 1px solid var(--mlv-border-normal);
    border-radius: var(--mlv-radius-m);
  "
  [messages]="messages()"
  [users]="users"
  selfId="me"
  (replyClick)="onReplyClick($event)"
/>

<p style="margin-block: 0.75rem 0; color: var(--mlv-text-secondary)">
  Jumped to: <strong>{{ lastJump() }}</strong>
</p>
