<mlv-scrollbar orientation="both" class="example-both-box">
  <table class="example-table">
    <thead>
      <tr>
        @for (col of columns; track col) {
          <th>{{ col }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows; track row[0]) {
        <tr>
          @for (cell of row; track $index) {
            <td>{{ cell }}</td>
          }
        </tr>
      }
    </tbody>
  </table>
</mlv-scrollbar>
