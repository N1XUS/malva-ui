<div class="demo-col" style="gap: 1.5rem; width: 100%">
  @for (size of sizes; track size) {
    <div class="demo-col" style="gap: 0.5rem; width: 100%">
      <span
        style="
          font-size: 0.75rem;
          font-weight: 500;
          color: var(--mlv-text-secondary);
          text-transform: capitalize;
        "
        >{{ size }}</span
      >
      <mlv-progress
        [value]="65"
        [size]="size"
        [ariaLabel]="size + ' progress bar'"
      />
    </div>
  }
</div>
