<form
  (submit)="onSubmit($event)"
  style="display: flex; flex-direction: column; gap: 16px; max-width: 400px"
>
  <mlv-form-field>
    <mlv-label>
      Full Name
      <mlv-hint>Required</mlv-hint>
    </mlv-label>
    <mlv-input
      [formField]="fields.name"
      ariaLabel="Full Name"
      placeholder="Enter your full name"
    />
  </mlv-form-field>

  <mlv-form-field>
    <mlv-label>
      Email
      <mlv-hint>Required</mlv-hint>
    </mlv-label>
    <mlv-input
      [formField]="fields.email"
      ariaLabel="Email"
      type="email"
      placeholder="user{'@'}example.com"
    />
  </mlv-form-field>

  <mlv-form-field>
    <mlv-label>Password</mlv-label>
    <mlv-input
      [formField]="fields.password"
      ariaLabel="Password"
      type="password"
      placeholder="Enter password"
    />
  </mlv-form-field>

  <mlv-form-field>
    <mlv-label>Country</mlv-label>
    <mlv-select
      [formField]="fields.country"
      [options]="countries"
      ariaLabel="Country"
      placeholder="Select a country"
    />
  </mlv-form-field>

  <mlv-form-field>
    <mlv-radio-group [formField]="fields.gender" label="Gender">
      <mlv-radio value="male">Male</mlv-radio>
      <mlv-radio value="female">Female</mlv-radio>
      <mlv-radio value="other">Other</mlv-radio>
    </mlv-radio-group>
  </mlv-form-field>

  <mlv-form-field>
    <mlv-checkbox [formField]="fields.terms">
      I accept the terms and conditions
    </mlv-checkbox>
  </mlv-form-field>

  <p style="margin: 0; color: var(--mlv-text-secondary)">
    Valid: {{ fields().valid() }} · Touched: {{ fields().touched() }}
  </p>

  <button
    mlvButton
    type="submit"
    [disabled]="fields().submitting()"
    [loading]="fields().submitting()"
  >
    Submit
  </button>

  @if (submitted()) {
    <pre>{{ model() | json }}</pre>
  }
</form>
