<div class="demo-row">

  <button mlvButton (click)="showPill('warning')">Pill · warning</button>
  <button mlvButton (click)="showPill('danger')">Pill · danger</button>

  <button mlvButton variant="secondary" (click)="showRectangle()">

  </button>
</div>
