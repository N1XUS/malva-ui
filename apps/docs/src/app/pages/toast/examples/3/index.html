<div
  class="demo-grid"
  style="
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 400px;
  "
>
  @for (pos of positions; track pos) {
    <button
      mlvButton
      variant="secondary"
      mlvDensity="compact"
      (mlvClick)="show(pos)"
    >
      {{ pos }}
    </button>
  }
</div>
