<mlv-taskboard
  [(items)]="tickets"
  [(columns)]="columns"
  dataKey="id"
  columnField="status"
  (moved)="onMoved($event)"
>
  <ng-template
    mlvTaskboardItemDef
    [mlvTaskboardItemDefFrom]="ticketType"
    let-card
  >
    <span class="ticket__id">{{ card.id }}</span>
    <span class="ticket__title">{{ card.title }}</span>
    <span class="ticket__owner">{{ card.owner }}</span>
  </ng-template>
</mlv-taskboard>

<p class="board-note" aria-live="polite">{{ lastMove() }}</p>
