<div class="virtual-toolbar">
  <mlv-search-field
    trigger="live"
    [debounce]="200"
    placeholder="Filter 500 cards"
    (search)="query.set($event)"
  />
  <p class="virtual-toolbar__count" aria-live="polite">
    {{ visibleCount() }} of {{ tickets().length }} cards shown
  </p>
</div>

<div class="virtual-board">
  <mlv-taskboard
    [(items)]="tickets"
    [(columns)]="columns"
    [visibleItems]="visibleTickets()"
    [virtualItemSize]="56"
    dataKey="id"
    columnField="status"
  >
    <ng-template
      mlvTaskboardItemDef
      [mlvTaskboardItemDefFrom]="ticketType"
      let-card
    >
      <span class="ticket__id">{{ card.id }}</span>
      <span class="ticket__title">{{ card.title }}</span>
    </ng-template>
  </mlv-taskboard>
</div>
