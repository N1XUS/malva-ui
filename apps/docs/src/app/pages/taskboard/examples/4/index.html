<div class="bulk-bar" role="group" aria-label="Bulk actions">
  <span class="bulk-bar__count">
    {{ selectedIds().length }} selected
    @if (selectedIds().length > 0) {
      <span class="bulk-bar__keys">({{ selectedIds().join(', ') }})</span>
    }
  </span>
  <button
    mlvButton
    variant="secondary"
    type="button"
    [disabled]="selectedIds().length === 0"
    (click)="moveSelectedTo('doing')"
  >
    Start
  </button>
  <button
    mlvButton
    variant="secondary"
    type="button"
    [disabled]="selectedIds().length === 0"
    (click)="moveSelectedTo('done')"
  >
    Complete
  </button>
  <button
    mlvButton
    variant="transparent"
    type="button"
    [disabled]="selectedIds().length === 0"
    (click)="clearSelection()"
  >
    Clear
  </button>
</div>

<mlv-taskboard
  [(items)]="tickets"
  [(columns)]="columns"
  [selection]="selected()"
  dataKey="id"
  columnField="status"
  (selectionChange)="onSelectionChange($event)"
  (cardActivated)="onCardActivated($event)"
>
  <ng-template
    mlvTaskboardItemDef
    [mlvTaskboardItemDefFrom]="ticketType"
    let-card
    let-selected="selected"
  >
    <span class="ticket__title">{{ card.title }}</span>
    @if (card.description) {
      <span class="ticket__description">{{ card.description }}</span>
    }
    <span class="ticket__tags">
      @for (tag of card.tags; track tag) {
        <span class="ticket__tag">{{ tag }}</span>
      }
      @if (selected) {
        <span class="ticket__tag ticket__tag--selected">Selected</span>
      }
    </span>
    <span class="ticket__footer">
      <mlv-avatar
        class="ticket__avatar"
        size="xs"
        [name]="card.owner"
        [color]="card.owner | mlvColorFromText"
      />
    </span>
  </ng-template>
</mlv-taskboard>

<p class="board-note" aria-live="polite">{{ lastActivated() }}</p>
