<div class="bulk-bar" role="group" aria-label="Bulk actions">
  <span class="bulk-bar__count">
    {{ selectedIds().length }} selected @if (selectedIds().length > 0) {
    <span class="bulk-bar__keys">({{ selectedIds().join(', ') }})</span>
    }
  </span>
  <button
    mlvButton
    variant="secondary"
    type="button"
    [disabled]="selectedIds().length === 0"
    (click)="moveSelectedTo('doing')"
  >
    Start
  </button>
  <button
    mlvButton
    variant="secondary"
    type="button"
    [disabled]="selectedIds().length === 0"
    (click)="moveSelectedTo('done')"
  >
    Complete
  </button>
  <button
    mlvButton
    variant="transparent"
    type="button"
    [disabled]="selectedIds().length === 0"
    (click)="clearSelection()"
  >
    Clear
  </button>
</div>

<mlv-taskboard
  [(items)]="tickets"
  [(columns)]="columns"
  [selection]="selected()"
  dataKey="id"
  columnField="status"
  (selectionChange)="onSelectionChange($event)"
  (cardActivated)="onCardActivated($event)"
>
  <ng-template
    mlvTaskboardItemDef
    [mlvTaskboardItemDefFrom]="ticketType"
    let-card
    let-selected="selected"
  >
    <span class="ticket__title">{{ card.title }}</span>
    @if (selected) {
    <span class="ticket__flag">Selected</span>
    }
  </ng-template>
</mlv-taskboard>

<p class="board-note" aria-live="polite">{{ lastActivated() }}</p>
