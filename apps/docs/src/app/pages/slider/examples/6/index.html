<div class="demo-row" style="align-items: flex-start; gap: 3rem">
  <div
    style="
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    "
  >
    <span
      style="
        font-size: var(--mlv-typography-body-s-size);
        color: var(--mlv-text-secondary);
      "
      >Temperature</span
    >
    <div style="display: flex; align-items: center; gap: 0.75rem">
      <mlv-slider
        orientation="vertical"
        [range]="true"
        [min]="10"
        [max]="35"
        [step]="1"
        style="height: 12rem"
        [(ngModel)]="tempRange"
      />
      <div
        style="
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          height: 12rem;
          padding-block: 0.625rem;
          font-size: var(--mlv-typography-ui-s-size);
          color: var(--mlv-text-secondary);
        "
      >
        <span>35°C</span>
        @if (tempRange(); as r) {
        <span style="color: var(--mlv-text-primary); font-weight: 600"
          >{{ r[1] }}°C</span
        >
        <span style="color: var(--mlv-text-primary); font-weight: 600"
          >{{ r[0] }}°C</span
        >
        }
        <span>10°C</span>
      </div>
    </div>
  </div>

  <div
    style="
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    "
  >
    <span
      style="
        font-size: var(--mlv-typography-body-s-size);
        color: var(--mlv-text-secondary);
      "
      >Humidity</span
    >
    <div style="display: flex; align-items: center; gap: 0.75rem">
      <mlv-slider
        orientation="vertical"
        [range]="true"
        [min]="0"
        [max]="100"
        [step]="5"
        [showTicks]="true"
        style="height: 12rem"
        [(ngModel)]="humidRange"
      />
      <div
        style="
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          height: 12rem;
          padding-block: 0.625rem;
          font-size: var(--mlv-typography-ui-s-size);
          color: var(--mlv-text-secondary);
        "
      >
        <span>100%</span>
        @if (humidRange(); as r) {
        <span style="color: var(--mlv-text-primary); font-weight: 600"
          >{{ r[1] }}%</span
        >
        <span style="color: var(--mlv-text-primary); font-weight: 600"
          >{{ r[0] }}%</span
        >
        }
        <span>0%</span>
      </div>
    </div>
  </div>
</div>
