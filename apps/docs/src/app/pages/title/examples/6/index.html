<div
  class="demo-col"
  style="gap: 0.75rem; align-items: stretch; max-width: 28rem"
>
  <h3 mlvTitle editable [formField]="fields.title">
    {{ fields.title().value() }}
  </h3>

  <p style="margin: 0; color: var(--mlv-text-secondary)">
    Value: {{ fields.title().value() }} · Touched:
    {{ fields.title().touched() }}
  </p>
</div>
