<div
  class="demo-col"
  style="gap: 0.75rem; align-items: stretch; max-width: 28rem"
>
  <mlv-combobox
    label="Tags"
    [options]="predefinedTags"
    [toOption]="tagToOption"
    [multiple]="true"
    placeholder="Search tags..."
  >
    <ng-template mlvComboboxItemDef let-option>
      <span class="tag-option">
        <span
          class="tag-option__swatch"
          [style.background]="option.value.color"
        ></span>
        {{ option.label }}
      </span>
    </ng-template>
  </mlv-combobox>
</div>
