<div class="page-preview">
  <main mlvPage maxWidth="72rem">
    <mlv-page-header>
      <div mlvPageContext>
        <a mlvLink variant="subtle" routerLink="/page">
          <ng-template mlvLinkBefore>
            <svg lucideChevronLeft [size]="16" aria-hidden="true" />
          </ng-template>
          All projects
        </a>
        <svg lucideFolderKanban [size]="20" aria-hidden="true" />
      </div>
      <ng-template mlvPageTitle>
        <h1 mlvTitle>Project Atlas</h1>
      </ng-template>
      <div mlvPageActions>
        <button mlvButton variant="outlined">Share</button>
        <button mlvButton>Create task</button>
      </div>
      <p mlvPageDescription>
        Coordinate the design-system rollout across product teams.
      </p>
      <div mlvPageMeta>
        <span>Updated today</span><span>12 collaborators</span>
      </div>
    </mlv-page-header>

    <mlv-page-content [stackBelow]="720" asideWidth="18rem">
      <section class="page-preview__section" aria-labelledby="overview-title">
        <h2 id="overview-title" mlvTitle>Overview</h2>
        <div class="page-preview__cards">
          <mlv-card><strong>24</strong><span>Open tasks</span></mlv-card>
          <mlv-card><strong>8</strong><span>In review</span></mlv-card>
          <mlv-card><strong>71%</strong><span>Complete</span></mlv-card>
        </div>
      </section>

      <aside mlvPageAside aria-label="Project details">
        <mlv-card>
          <h2 mlvTitle>Project details</h2>
          <dl class="page-preview__details">
            <div>
              <dt>Owner</dt>
              <dd>Design systems</dd>
            </div>
            <div>
              <dt>Visibility</dt>
              <dd>Workspace</dd>
            </div>
            <div>
              <dt>Due date</dt>
              <dd>September 18</dd>
            </div>
          </dl>
        </mlv-card>
      </aside>
    </mlv-page-content>
  </main>
</div>
