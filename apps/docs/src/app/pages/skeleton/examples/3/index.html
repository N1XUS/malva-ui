<div class="skeleton-card-demo">
  <!-- Poster image placeholder -->
  <mlv-skeleton
    class="skeleton-card-demo__poster"
    variant="rectangle"
    width="100%"
    height="10rem"
  />

  <div class="skeleton-card-demo__body">
    <!-- Avatar + meta row -->
    <div class="skeleton-card-demo__author-row">
      <mlv-skeleton variant="circle" width="2.25rem" height="2.25rem" />
      <div class="skeleton-card-demo__author-text">
        <mlv-skeleton variant="text" width="7rem" />
        <mlv-skeleton variant="text" width="4.5rem" />
      </div>
    </div>

    <!-- Title lines -->
    <div class="skeleton-card-demo__title">
      <mlv-skeleton variant="text" width="95%" />
      <mlv-skeleton variant="text" width="80%" />
    </div>

    <!-- Body copy lines -->
    <div class="skeleton-card-demo__copy">
      <mlv-skeleton variant="text" width="100%" />
      <mlv-skeleton variant="text" width="100%" />
      <mlv-skeleton variant="text" width="65%" />
    </div>
  </div>
</div>
