<div class="demo-row" style="flex-wrap: wrap">
  <mlv-chip tone="warning" muted>
    <ng-template mlvChipPrepend>
      <mlv-avatar size="xs" src="https://i.pravatar.cc/150?img=3" />
    </ng-template>
    Featured
  </mlv-chip>

  <mlv-chip tone="info" muted>
    <ng-template mlvChipPrepend>
      <svg lucideTag />
    </ng-template>
    Label
  </mlv-chip>

  <mlv-chip tone="accent" muted>
    <ng-template mlvChipPrepend>
      <svg lucideZap />
    </ng-template>
    Fast
  </mlv-chip>

  <mlv-chip tone="primary" muted>
    Next step
    <ng-template mlvChipAppend>
      <svg lucideArrowRight />
    </ng-template>
  </mlv-chip>

  <mlv-chip tone="success" muted>
    <ng-template mlvChipPrepend>
      <svg lucideCircleCheck />
    </ng-template>
    Verified
    <ng-template mlvChipAppend>
      <svg lucideArrowRight />
    </ng-template>
  </mlv-chip>
</div>
