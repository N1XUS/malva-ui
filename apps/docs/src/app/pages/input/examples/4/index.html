<div class="demo-col">
  <div class="demo-row">
    @for (level of densityLevels; track level) {
      <button
        mlvButton
        type="button"
        [variant]="density() === level ? 'primary' : 'secondary'"
        (click)="density.set(level)"
      >
        {{ level }}
      </button>
    }
  </div>
  <form mlvForm [mlvDensity]="density()" aria-label="Contact details">
    <mlv-input label="First name" placeholder="John" />
    <mlv-input label="Email" placeholder="john@example.com" />
  </form>
</div>
