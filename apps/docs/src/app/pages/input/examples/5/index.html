<div
  class="demo-row"
  style="
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    max-width: 20rem;
  "
>
  <mlv-input
    label="Email"
    placeholder="you@example.com"
    [formField]="f.email"
  />

  <p style="margin: 0; color: var(--mlv-text-secondary)">
    value: "{{ f.email().value() }}" · valid: {{ f.email().valid() }} · touched:
    {{ f.email().touched() }}
  </p>
</div>
