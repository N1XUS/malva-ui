<div class="demo-col" style="gap: 1.5rem; max-width: 20rem">
  <mlv-number-input
    label="Price (USD)"
    hint="Adjust price in $0.01 increments"
    [min]="0"
    [step]="0.01"
    [precision]="2"
    [formControl]="priceCtrl"
  />
  <span
    style="
      font-size: var(--mlv-typography-body-s-size);
      color: var(--mlv-text-secondary);
    "
  >
    Formatted: ${{ priceCtrl.value?.toFixed(2) }}
  </span>
</div>
